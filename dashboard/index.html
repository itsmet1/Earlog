<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EarLog</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1117;
    color: #e6e6e6;
    margin: 0;
    padding: 24px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #8a8f98;
    margin-bottom: 24px;
    font-size: 14px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: #171a21;
    border: 1px solid #262a33;
    border-radius: 10px;
    padding: 16px;
  }
  .stat-value {
    font-size: 26px;
    font-weight: 600;
  }
  .stat-label {
    color: #8a8f98;
    font-size: 12px;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .card {
    background: #171a21;
    border: 1px solid #262a33;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 12px 0;
    color: #c7cad1;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid #262a33;
  }
  th {
    color: #8a8f98;
    font-weight: 500;
  }
  .ongoing-badge {
    background: #1f3a2e;
    color: #4ade80;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
  }
  canvas {
    max-height: 260px;
  }
</style>
</head>
<body>

<h1>🎧 EarLog</h1>
<div class="subtitle">Automatic focus tracking, powered by your earbuds' Bluetooth connection</div>

<div class="stats-grid" id="stats-grid">
  <div class="stat-card"><div class="stat-value" id="stat-today">-</div><div class="stat-label">Today</div></div>
  <div class="stat-card"><div class="stat-value" id="stat-week">-</div><div class="stat-label">This week</div></div>
  <div class="stat-card"><div class="stat-value" id="stat-longest">-</div><div class="stat-label">Longest session</div></div>
  <div class="stat-card"><div class="stat-value" id="stat-streak">-</div><div class="stat-label">Day streak</div></div>
</div>

<div class="card">
  <h2>Daily focus time (last 7 days)</h2>
  <canvas id="chart"></canvas>
</div>

<div class="card">
  <h2>Recent sessions</h2>
  <table>
    <thead>
      <tr><th>Start</th><th>End</th><th>Duration</th></tr>
    </thead>
    <tbody id="sessions-body"></tbody>
  </table>
</div>

<script>
async function loadData() {
  const [sessionsRes, statsRes] = await Promise.all([
    fetch('/api/sessions'),
    fetch('/api/stats')
  ]);
  const sessions = await sessionsRes.json();
  const stats = await statsRes.json();

  document.getElementById('stat-today').textContent = formatMinutes(stats.today_minutes);
  document.getElementById('stat-week').textContent = formatMinutes(stats.week_minutes);
  document.getElementById('stat-longest').textContent = formatMinutes(stats.longest_session_minutes);
  document.getElementById('stat-streak').textContent = stats.streak_days + (stats.streak_days === 1 ? ' day' : ' days');

  renderSessionsTable(sessions.slice(0, 20));
  renderChart(sessions);
}

function formatMinutes(mins) {
  if (mins < 60) return Math.round(mins) + 'm';
  const h = Math.floor(mins / 60);
  const m = Math.round(mins % 60);
  return `${h}h ${m}m`;
}

function renderSessionsTable(sessions) {
  const body = document.getElementById('sessions-body');
  body.innerHTML = '';
  for (const s of sessions) {
    const tr = document.createElement('tr');
    const start = new Date(s.start).toLocaleString();
    const end = s.ongoing
      ? '<span class="ongoing-badge">ongoing</span>'
      : new Date(s.end).toLocaleString();
    tr.innerHTML = `<td>${start}</td><td>${end}</td><td>${formatMinutes(s.duration_minutes)}</td>`;
    body.appendChild(tr);
  }
}

function renderChart(sessions) {
  const days = [];
  const totals = {};
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    days.push(key);
    totals[key] = 0;
  }

  for (const s of sessions) {
    const key = s.start.slice(0, 10);
    if (key in totals) totals[key] += s.duration_minutes;
  }

  const ctx = document.getElementById('chart').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: days.map(d => d.slice(5)),
      datasets: [{
        label: 'Minutes',
        data: days.map(d => Math.round(totals[d])),
        backgroundColor: '#4ade80',
        borderRadius: 4
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: '#262a33' }, ticks: { color: '#8a8f98' } },
        y: { grid: { color: '#262a33' }, ticks: { color: '#8a8f98' } }
      }
    }
  });
}

loadData();
setInterval(loadData, 15000); // refresh every 15s
</script>

</body>
</html>
